name: Automated tests
on:
  pull_request:
    branches:
      - main
jobs:
  Jest:
    name: JestUbuntu
    runs-on: ubuntu-24.04
    steps:
      - name: Copy codebase to ci
        uses: actions/checkout@v4
      - name: Setup of node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
      - name: Installing dependencies
        run: npm ci
      - name: Test
        run: npm test
